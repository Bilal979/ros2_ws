# ros2 run turtlesim turtlesim_node --ros-args -p background_r:=128 -p background_g:=0 -p background_b:=0
# ros2 run turtle_controller turtle_controller --ros-args -r __ns:=/t1 -p color_1:="[0, 0, 0]" -p color_2:="[255, 255, 255]" -p turtle_velocity:=1.5

/t1/turtlesim:
  ros__parameters:
    background_r: 128
    background_g: 0
    background_b: 0

/t1/turtle_controller:
  ros__parameters:
    color_1: [0,0,0]
    color_2: [255,255,255]
    turtle_velocity: 1.5

/t2/turtlesim:
  ros__parameters:
    background_r: 0
    background_g: 128
    background_b: 0

/t2/turtle_controller:
  ros__parameters:
    color_1: [255, 255, 255]
    color_2: [0, 0, 0]
    turtle_velocity: 0.5

